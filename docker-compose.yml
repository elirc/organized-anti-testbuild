version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: globalworkforce-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gwos_user
      POSTGRES_PASSWORD: gwos_password123!
      POSTGRES_DB: gwos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
